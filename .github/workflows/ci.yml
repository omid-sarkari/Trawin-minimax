name: CI
on:
  push:
    branches: [ 'feature/behavior-intelligence-resume-system' ]
  pull_request:
    branches: [ 'feature/behavior-intelligence-resume-system' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --workspaces
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm run test
